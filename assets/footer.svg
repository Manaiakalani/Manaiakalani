<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 854 140" width="100%" role="img" aria-label="Mahalo — made with aloha in the PNW">
  <defs>
  <linearGradient id="fbg" x1="100%" y1="100%" x2="0%" y2="0%">
    <stop offset="0%" stop-color="#0d1117"/>
    <stop offset="55%" stop-color="#161b22"/>
    <stop offset="100%" stop-color="#1f6feb">
      <animate attributeName="stop-color" values="#1f6feb;#2ea043;#a371f7;#1f6feb" dur="18s" repeatCount="indefinite"/>
    </stop>
  </linearGradient>
  <radialGradient id="fglow" cx="15%" cy="65%" r="55%">
    <stop offset="0%" stop-color="#58a6ff" stop-opacity="0.55"/>
    <stop offset="60%" stop-color="#58a6ff" stop-opacity="0.10"/>
    <stop offset="100%" stop-color="#58a6ff" stop-opacity="0"/>
  </radialGradient>
  </defs>
  <style>
@font-face {
  font-family: "Space Grotesk";
  src: url("data:font/woff2;base64,") format("woff2");
  font-weight: 300 700;
  font-style: normal;
}
@font-face {
  font-family: "Space Mono";
  src: url("data:font/woff2;base64,") format("woff2");
  font-weight: 400;
  font-style: normal;
}
  </style>
  <rect width="854" height="140" rx="16" fill="url(#fbg)"/>
  <rect width="854" height="140" rx="16" fill="url(#fglow)">
    <animate attributeName="opacity" values="0.85;1;0.85" dur="6s" repeatCount="indefinite"/>
  </rect>
  <rect width="854" height="140" rx="16" fill="none" stroke="#30363d" stroke-width="1"/>
  <text x="48" y="80" fill="#ffffff" font-family="Space Grotesk, DM Sans, sans-serif" font-size="24" font-weight="400">Mahalo for stopping by</text>
  <text x="48" y="110" fill="#8b949e" font-family="Space Mono, ui-monospace, monospace" font-size="11" font-weight="400" letter-spacing="0.88">BUILT WITH ALOHA  /  REDMOND, WA</text>
</svg>
