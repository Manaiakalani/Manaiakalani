  <text x="48" y="118" fill="#1f2328" font-family="Doto, Space Mono, monospace" font-size="40" font-weight="700" letter-spacing="-0.8">Maximilian (Manaiakalani) Stein</text>
  <text x="48" y="158" fill="#656d76" font-family="Space Mono, ui-monospace, monospace" font-size="12" font-weight="400" letter-spacing="0.96">PRODUCT MANAGER  /  MICROSOFT</text>
