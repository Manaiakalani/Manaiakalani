<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 854 200" width="100%" role="img" aria-label="Maximilian (Manaiakalani) Stein — Product Manager • Microsoft">
  <defs>
  <linearGradient id="hbg" x1="0%" y1="0%" x2="100%" y2="100%">
    <stop offset="0%" stop-color="#ffffff"/>
    <stop offset="55%" stop-color="#f6f8fa"/>
    <stop offset="100%" stop-color="#54aeff">
      <animate attributeName="stop-color" values="#54aeff;#2da44e;#8250df;#54aeff" dur="18s" repeatCount="indefinite"/>
    </stop>
  </linearGradient>
  <radialGradient id="hglow" cx="85%" cy="35%" r="55%">
    <stop offset="0%" stop-color="#0969da" stop-opacity="0.30"/>
    <stop offset="60%" stop-color="#0969da" stop-opacity="0.06"/>
    <stop offset="100%" stop-color="#0969da" stop-opacity="0"/>
  </radialGradient>
  </defs>
  <style>
@font-face {
  font-family: "Doto";
  src: url("data:font/woff2;base64,") format("woff2");
  font-weight: 700;
  font-style: normal;
}
@font-face {
  font-family: "Space Mono";
  src: url("data:font/woff2;base64,") format("woff2");
  font-weight: 400;
  font-style: normal;
}
  </style>
  <rect width="854" height="200" rx="16" fill="url(#hbg)"/>
  <rect width="854" height="200" rx="16" fill="url(#hglow)">
    <animate attributeName="opacity" values="0.85;1;0.85" dur="6s" repeatCount="indefinite"/>
  </rect>
  <rect width="854" height="200" rx="16" fill="none" stroke="#d0d7de" stroke-width="1"/>
